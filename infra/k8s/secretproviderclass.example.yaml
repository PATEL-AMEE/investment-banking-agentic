# Template only — the live manifest is generated and applied by
# infra/deploy_aks.sh (USE_KEY_VAULT=true, the default), which fills in the
# vault name, tenant id, and the Key Vault addon's managed-identity client id,
# and includes only the secrets actually uploaded to the vault.
#
# The CSI driver mounts the vault secrets into the pod and, via
# secretObjects, syncs them into the `agentic-api-secrets` Kubernetes Secret
# that the Deployment already consumes through envFrom — so the application
# needs no code changes and no raw `kubectl create secret` step.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: agentic-api-keyvault
  namespace: agentic-platform
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "<key-vault-addon-client-id>"
    keyvaultName: "<key-vault-name>"
    tenantId: "<tenant-id>"
    objects: |
      array:
        - |
          objectName: audit-signing-key
          objectType: secret
        - |
          objectName: local-jwt-secret
          objectType: secret
        - |
          objectName: llm-api-key
          objectType: secret
  secretObjects:
    - secretName: agentic-api-secrets
      type: Opaque
      data:
        - objectName: audit-signing-key
          key: AUDIT_SIGNING_KEY
        - objectName: local-jwt-secret
          key: LOCAL_JWT_SECRET
        - objectName: llm-api-key
          key: LLM_API_KEY
