apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agentic-platform
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
# The image is overridden at deploy time, e.g.:
#   kustomize edit set image investment-banking-agentic-api=<ACR>.azurecr.io/investment-banking-agentic-api:latest
images:
  - name: investment-banking-agentic-api
    newName: investment-banking-agentic-api
    newTag: latest
