  AUDIT_SIGNING_KEY: "change-me-in-production"
  LOCAL_JWT_SECRET: "change-me-in-production"
  APPLICATIONINSIGHTS_CONNECTION_STRING: ""
  AZURE_AD_TENANT_ID: ""
  AZURE_AD_CLIENT_ID: ""
  VERTEX_PROJECT: ""
  VERTEX_ACCESS_TOKEN: ""
  VERTEX_TUNED_ENDPOINT: ""
  AZURE_SEARCH_KEY: ""
