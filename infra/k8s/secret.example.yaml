# Fallback template only — the default deploy path (infra/deploy_aks.sh with
# USE_KEY_VAULT=true) sources these from Azure Key Vault via the CSI
# secrets-store driver and syncs them into this same `agentic-api-secrets`
# Secret automatically (see secretproviderclass.example.yaml and the AKS
# implementation guide, §8). To manage the Secret by hand instead
# (USE_KEY_VAULT=false), copy to secret.yaml (gitignored), fill in values:
#   kubectl apply -f infra/k8s/secret.yaml
apiVersion: v1
