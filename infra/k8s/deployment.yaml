apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentic-api
  namespace: agentic-platform
  labels:
    app: agentic-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agentic-api
  template:
    metadata:
      labels:
        app: agentic-api
    spec:
      containers:
        - name: api
          # Overridden at deploy time (kustomize images / kubectl set image)
          # with <ACR>.azurecr.io/investment-banking-agentic-api:<tag>.
          image: investment-banking-agentic-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: agentic-api-config
            - secretRef:
                name: agentic-api-secrets
                optional: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop: ["ALL"]
