apiVersion: v1
kind: Service
metadata:
  name: agentic-api
  namespace: agentic-platform
  labels:
    app: agentic-api
spec:
  # LoadBalancer provisions an Azure public IP. Swap to ClusterIP + an
  # ingress controller (AGIC / NGINX) with TLS for production exposure.
  type: LoadBalancer
  selector:
    app: agentic-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
