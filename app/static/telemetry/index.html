<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compliance Platform — Tracing</title>
<link rel="stylesheet" href="/static/app.css">
<style>
  :root{--sup:#1e3a8a;--mcp:#8a5cf6;--agent:#0ea5b7;--llm:#d98a00;--nlp:#0a8a5f;--tool:#6b7280}
  .tel-cols{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
  .card .eyebrow{margin:0 0 12px}
  .card .eyebrow::after{display:none}
  .trow{display:flex;flex-direction:column;gap:3px;padding:12px;border:1px solid var(--hair);border-radius:var(--radius-sm);margin-bottom:8px;cursor:pointer;background:var(--surface-2);transition:.14s}
  .trow:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--hair))}
  .trow.sel{border-color:var(--accent);background:var(--accent-soft)}
  .trow .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .trow .root{font-weight:640;font-size:13.5px}
  .trow .r2{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
  .pill.ok{color:var(--good);background:var(--good-bg);text-transform:none;font-weight:700}
  .pill.err{color:var(--critical);background:var(--crit-bg);text-transform:none;font-weight:700}
  .wf-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
  .wf-total{font-size:24px;font-weight:750;letter-spacing:-.02em}
  .legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2);margin:12px 0 16px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .sw{width:10px;height:10px;border-radius:3px}
  .wfrow{display:grid;grid-template-columns:230px 1fr 66px;gap:10px;align-items:center;padding:5px 0}
  .wfrow .lbl{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .wfrow .lbl .nm{font-family:var(--mono);font-size:11.5px}
  .track{position:relative;height:16px;background:var(--surface-3);border-radius:5px;overflow:hidden}
  .track i{position:absolute;top:0;height:100%;border-radius:5px;min-width:2px}
  .wfrow .dur{text-align:right;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
  .wfrow.err .nm{color:var(--critical)}
  .sect{margin-top:22px}
  .ev{font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--grid);display:flex;justify-content:space-between;gap:10px}
  .ev:last-child{border:none}
  .ev .lg{font-family:var(--mono);color:var(--muted);font-size:11px}
  @media (max-width:920px){.tel-cols{grid-template-columns:1fr}.wfrow{grid-template-columns:150px 1fr 56px}}
</style>
<script src="/static/auth.js"></script>
</head>
<body data-page="telemetry">
<div class="app">
  <aside class="sidebar" id="appSidebar"></aside>
  <main class="main">
    <header class="topbar">
      <div>
        <h1>Request tracing</h1>
        <p class="sub">Live waterfalls across the multi-agent pipeline · correlated with the audit trail</p>
      </div>
      <div class="actions">
        <span class="badge live"><span class="dot"></span>Live</span>
        <button class="btn pri" id="gen">▷ Generate sample request</button>
        <span id="authslot"></span>
        <button class="btn icon" id="refresh" title="Refresh">↻</button>
        <button class="btn icon" id="theme" title="Toggle theme">◐</button>
      </div>
    </header>

    <div class="content">
      <div class="meta" id="meta">Loading traces…</div>
      <div class="tel-cols">
        <div class="card">
          <div class="eyebrow">Recent requests</div>
          <div id="tlist"><div class="empty">No traces yet.</div></div>
        </div>
        <div class="card">
          <div class="eyebrow">Waterfall</div>
          <div id="detail"><div class="empty">Select a request on the left, or click <b>Generate sample request</b> to create one.</div></div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="/static/shell.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let selected = null;

$('#theme').onclick = () => {
  const r = document.documentElement, cur = r.getAttribute('data-theme');
  const dark = matchMedia('(prefers-color-scheme:dark)').matches;
  r.setAttribute('data-theme', cur==='dark'?'light':cur==='light'?'dark':(dark?'light':'dark'));
};

// Map a span name to its category colour (matches the legend).
function spanColor(name){
  if(name.startsWith('agent.supervisor')) return 'var(--sup)';
  if(name.startsWith('mcp.')) return 'var(--mcp)';
  if(name.startsWith('llm.')) return 'var(--llm)';
  if(name.startsWith('nlp.')) return 'var(--nlp)';
  if(name.startsWith('tool.')) return 'var(--tool)';
  if(name.startsWith('agent.')) return 'var(--agent)';
  return 'var(--ink-2)';
}

async function loadTraces(keepSel){
  let d;
  try { d = await (await fetch('/api/telemetry/traces?limit=25')).json(); }
  catch(e){ $('#meta').textContent = 'Could not reach /api/telemetry/traces — is the app running?'; return; }
  $('#meta').textContent = `${d.count} trace${d.count===1?'':'s'} in the retained window · polling every 4s`;
  const el = $('#tlist');
  if(!d.traces.length){ el.innerHTML = '<div class="empty">No traces yet. Click “Generate sample request”.</div>'; return; }
  el.innerHTML = d.traces.map(t => `
    <div class="trow ${t.trace_id===selected?'sel':''}" data-id="${t.trace_id}">
      <div class="r1"><span class="root">${esc(t.root)}</span>
        <span class="pill ${t.status==='OK'?'ok':'err'}">${esc(t.status)}</span></div>
      <div class="r2"><span class="num">${t.total_ms==null?'—':t.total_ms+' ms'} · ${t.span_count} spans</span>
        <span class="idc">${esc(t.trace_id.slice(0,12))}…</span></div>
    </div>`).join('');
  el.querySelectorAll('.trow').forEach(r => r.onclick = () => selectTrace(r.dataset.id));
  if(keepSel && selected) selectTrace(selected, true);
}

async function selectTrace(id, silent){
  selected = id;
  document.querySelectorAll('.trow').forEach(r => r.classList.toggle('sel', r.dataset.id===id));
  const d = await (await fetch('/api/telemetry/trace/'+id)).json();
  if(d.detail){ $('#detail').innerHTML = '<div class="empty">'+esc(d.detail)+'</div>'; return; }
  const total = d.total_ms || Math.max(...d.spans.map(s=>s.offset_ms+(s.duration_ms||0)), 1);
  const rows = d.spans.map(s => {
    const left = 100*s.offset_ms/total, width = Math.max(0.6, 100*(s.duration_ms||0)/total);
    const pad = 8 + s.depth*14;
    return `<div class="wfrow ${s.status==='ERROR'?'err':''}">
      <div class="lbl" style="padding-left:${pad}px"><span class="nm" style="color:${spanColor(s.name)}">${esc(s.name)}</span></div>
      <div class="track"><i style="left:${left}%;width:${width}%;background:${spanColor(s.name)}"></i></div>
      <div class="dur num">${s.duration_ms==null?'—':s.duration_ms.toFixed(0)+'ms'}</div>
    </div>`;
  }).join('');
  const audit = (d.audit_events||[]).map(e => `
    <div class="ev"><span><b>${esc(e.event_type)}</b> · ${esc(e.result)} <span style="color:var(--muted)">${esc(e.actor_id)} → ${esc(e.resource_id||'')}</span></span>
      <span class="lg">${esc(e.log_id)}</span></div>`).join('') || '<div class="empty">No audit events for this trace.</div>';
  $('#detail').innerHTML = `
    <div class="wf-head">
      <div><span class="wf-total num">${d.total_ms?d.total_ms.toFixed(0):'—'} ms</span>
        <span style="color:var(--muted);font-size:12.5px"> total · ${d.span_count} spans · <span class="pill ${d.status==='OK'?'ok':'err'}">${esc(d.status)}</span></span></div>
      <span class="idc">trace ${esc(d.trace_id.slice(0,16))}…</span>
    </div>
    <div class="legend">
      <span><span class="sw" style="background:var(--sup)"></span>supervisor</span>
      <span><span class="sw" style="background:var(--mcp)"></span>MCP tool call</span>
      <span><span class="sw" style="background:var(--agent)"></span>agent</span>
      <span><span class="sw" style="background:var(--llm)"></span>LLM</span>
      <span><span class="sw" style="background:var(--nlp)"></span>NLP</span>
      <span><span class="sw" style="background:var(--tool)"></span>retrieval</span>
    </div>
    ${rows}
    <div class="sect">
      <div class="eyebrow">Correlated audit trail <span style="text-transform:none;font-weight:400;color:var(--muted)">— same trace id, separate system</span></div>
      ${audit}
    </div>`;
}

$('#gen').onclick = async () => {
  const btn = $('#gen'); btn.disabled = true; btn.textContent = 'Running…';
  try {
    const r = await (await fetch('/api/agents/ask', {method:'POST',headers:{'Content-Type':'application/json'},
      body: JSON.stringify({query:'Run a compliance check and client profile for client C123', clientId:'C123'})})).json();
    await loadTraces();
    if(r.traceId) selectTrace(r.traceId);
  } finally { btn.disabled = false; btn.textContent = '▷ Generate sample request'; }
};
$('#refresh').onclick = () => loadTraces(true);

loadTraces();
setInterval(() => loadTraces(true), 4000);
</script>
</body>
</html>
